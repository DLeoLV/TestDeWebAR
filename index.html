<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Unity WebGL Player | WebAR-ProyectoCapacitacion</title>

    <meta name="description" content="">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>

  <body>

    <div id="unity-container">

      <div id="unity-canvas-container">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;"></canvas>
      </div>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>

        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-footer">

        <div id="unity-webgl-logo"></div>

        <button id="entervr" value="Enter VR" disabled>
          VR
        </button>

        <button id="enterar" value="Enter AR" disabled>
          AR
        </button>

        <!-- Estado de compatibilidad AR -->
        <div id="ar-status">
          Comprobando compatibilidad...
        </div>

        <div id="unity-webxr-link">
          Using
          <a
            href="https://github.com/De-Panther/unity-webxr-export"
            target="_blank"
            title="WebXR Export">
            WebXR Export
          </a>
        </div>

        <div id="unity-build-title">
          WebAR-ProyectoCapacitacion
        </div>

      </div>

    </div>


    <script>

      /* =========================================================
         CONFIGURACI�N UNITY
         ========================================================= */

      var buildUrl = "Build";

      var loaderUrl =
        buildUrl + "/TestWebAR - Nivel 1.loader.js";

      var config = {

        dataUrl:
          buildUrl + "/TestWebAR - Nivel 1.data.unityweb",

        frameworkUrl:
          buildUrl + "/TestWebAR - Nivel 1.framework.js.unityweb",

        codeUrl:
          buildUrl + "/TestWebAR - Nivel 1.wasm.unityweb",



        streamingAssetsUrl: "StreamingAssets",

        companyName:
          "DefaultCompany",

        productName:
          "WebAR-ProyectoCapacitacion",

        productVersion:
          "0.1.0",
      };


      /* =========================================================
         ELEMENTOS HTML
         ========================================================= */

      var container =
        document.querySelector("#unity-container");

      var canvas =
        document.querySelector("#unity-canvas");

      var canvasContainer =
        document.querySelector("#unity-canvas-container");

      var loadingBar =
        document.querySelector("#unity-loading-bar");

      var progressBarFull =
        document.querySelector("#unity-progress-bar-full");

      var fullscreenButton =
        document.querySelector("#unity-fullscreen-button");


      /* =========================================================
         ELEMENTOS AR
         ========================================================= */

      var enterARButton =
        document.getElementById("enterar");

      var enterVRButton =
        document.getElementById("entervr");

      var arStatus =
        document.getElementById("ar-status");


      /* =========================================================
         VARIABLES
         ========================================================= */

      var unityInstance = null;

      var arCompatible = false;

      var arComprobado = false;

      var arIntentandoIniciar = false;

      var arSesionIniciada = false;


      /* =========================================================
         WEBXR POLYFILL
         ========================================================= */

      


      /* =========================================================
         TAMA�O DEL CANVAS
         ========================================================= */

      canvasContainer.style.width =
        "960px";

      canvasContainer.style.height =
        "600px";




      loadingBar.style.display = "block";


      /* =========================================================
         FUNCIONES DE ESTADO AR
         ========================================================= */

      function MostrarEstadoAR(mensaje)
      {
        if (arStatus != null)
        {
          arStatus.textContent = mensaje;
        }
      }


      function EnviarEstadoAUnity(mensaje)
      {
        if (unityInstance == null)
          return;

        try
        {
          unityInstance.SendMessage(
            "ComprobadorAR",
            "ResultadoCompatibilidadAR",
            mensaje
          );
        }
        catch (error)
        {
          console.log(
            "No se pudo enviar el estado AR a Unity:",
            error
          );
        }
      }


      /* =========================================================
         CARGAR UNITY
         ========================================================= */

      var script =
        document.createElement("script");

      script.src = loaderUrl;


      script.onload = () =>
      {

        createUnityInstance(
          canvas,
          config,

          (progress) =>
          {
            progressBarFull.style.width =
              100 * progress + "%";
          }

        ).then((instance) =>
        {

          unityInstance = instance;

          loadingBar.style.display = "none";


          /* -----------------------------------------
             FULLSCREEN
             ----------------------------------------- */

          if (fullscreenButton)
          {
            fullscreenButton.onclick = () =>
            {
              unityInstance.SetFullscreen(1);
            };
          }


          /* -----------------------------------------
             Si la comprobaci�n AR ya ocurri� antes
             de que Unity terminara de cargar,
             enviamos nuevamente el resultado.
             ----------------------------------------- */

          if (arComprobado)
          {
            if (arCompatible)
            {
              EnviarEstadoAUnity(
                "Tu tel�fono es compatible con AR."
              );
            }
            else
            {
              EnviarEstadoAUnity(
                "Tu tel�fono no es compatible con AR."
              );
            }
          }

        }).catch((message) =>
        {

          console.error(
            "Error cargando Unity:",
            message
          );

          alert(message);

        });

      };


      document.body.appendChild(script);


      /* =========================================================
         COMPROBACI�N DE COMPATIBILIDAD AR
         ========================================================= */

      document.addEventListener(
        "onARSupportedCheck",

        function(event)
        {

          arComprobado = true;

          arCompatible =
            event.detail.supported;


          /* -----------------------------------------
             TEL�FONO COMPATIBLE
             ----------------------------------------- */

          if (arCompatible)
          {

            MostrarEstadoAR(
              "Compatible con AR"
            );

            enterARButton.disabled = false;


            EnviarEstadoAUnity(
              "Tu tel�fono es compatible con AR."
            );

          }


          /* -----------------------------------------
             TEL�FONO NO COMPATIBLE
             ----------------------------------------- */

          else
          {

            MostrarEstadoAR(
              "Este tel�fono no es compatible con AR."
            );

            enterARButton.disabled = true;


            EnviarEstadoAUnity(
              "Tu tel�fono no es compatible con AR."
            );

          }

        },

        false
      );


      /* =========================================================
         COMPROBACI�N VR
         ========================================================= */

      document.addEventListener(
        "onVRSupportedCheck",

        function(event)
        {

          enterVRButton.disabled =
            !event.detail.supported;

        },

        false
      );


      /* =========================================================
         BOT�N AR
         ========================================================= */

      enterARButton.addEventListener(
        "click",

        function(event)
        {

          if (!arCompatible)
          {
            MostrarEstadoAR(
              "Este tel�fono no es compatible con AR."
            );

            return;
          }


          if (unityInstance == null)
          {
            MostrarEstadoAR(
              "AR compatible, pero Unity todav�a no ha cargado."
            );

            return;
          }


          if (arIntentandoIniciar)
            return;


          arIntentandoIniciar = true;


          MostrarEstadoAR(
            "Iniciando AR..."
          );


          try
          {

            unityInstance.Module.WebXR.toggleAR();


            /*
             * WebXR Export deber�a generar posteriormente
             * el cambio real de estado de la sesi�n.
             *
             * Por ahora dejamos un tiempo de espera
             * para detectar un posible fallo de inicio.
             */

            setTimeout(
              function()
              {

                if (!arSesionIniciada)
                {

                  MostrarEstadoAR(
                    "AR compatible, pero no se pudo iniciar la sesi�n."
                  );

                  EnviarEstadoAUnity(
                    "AR compatible, pero no se pudo iniciar la sesi�n."
                  );

                  arIntentandoIniciar = false;

                }

              },

              4000
            );

          }

          catch(error)
          {

            console.error(
              "Error al iniciar AR:",
              error
            );


            MostrarEstadoAR(
              "AR compatible, pero no se pudo iniciar la sesi�n."
            );


            EnviarEstadoAUnity(
              "AR compatible, pero no se pudo iniciar la sesi�n."
            );


            arIntentandoIniciar = false;

          }

        },

        false
      );


      /* =========================================================
         BOT�N VR
         ========================================================= */

      enterVRButton.addEventListener(
        "click",

        function(event)
        {

          if (unityInstance == null)
            return;

          unityInstance.Module.WebXR.toggleVR();

        },

        false
      );


    </script>

  </body>
</html>
